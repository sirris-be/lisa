---
layout: page
---

<section class="page-hero page-hero-compact">
  <p class="eyebrow">People</p>
  <h1>The team behind LISA</h1>
  <p class="lede">
    Researchers and advisors from KU Leuven DistriNet and Sirris driving the
    project's technical agenda.
  </p>
</section>

<section class="people-grid">
  {% for person in site.data.people %}
  <a
    class="person-card"
    href="{{ person.link }}"
    target="_blank"
    rel="noreferrer"
  >
    <img src="{{ person.photo }}" alt="{{ person.name }}" />
    <div>
      <p class="eyebrow">{{ person.org }}</p>
      <h2>{{ person.name }}</h2>
      <p>{{ person.role }}</p>
      <span>{{ person.email }}</span>
    </div>
  </a>
  {% endfor %}
</section>
