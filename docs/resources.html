---
layout: page
---

<section class="page-hero page-hero-compact">
  <p class="eyebrow">Resources</p>
  <h1>Reference material from the project and its events</h1>
  <p class="lede">
    Slides, recordings, and reference documents related to LISA themes and
    events.
  </p>
</section>

<section class="resource-grid">
  {% for resource in site.data.resources %}
  <a
    class="resource-card"
    href="{{ resource.link }}"
    target="_blank"
    rel="noreferrer"
  >
    <p class="eyebrow">{{ resource.author }}</p>
    <h2>{{ resource.title }}</h2>
    <p>{{ resource.summary }}</p>
  </a>
  {% endfor %}
</section>
